<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Qwen ACP Web终端</title>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Consolas, monospace; }
    body { background: #1a1a1a; color: #eee; padding: 20px; height: 100vh; display: flex; flex-direction: column; }
    #terminal {
      flex: 1;
      background: #0d0d0d;
      padding: 12px;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }
    .input-line {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 12px;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }
    #send {
      padding: 0 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .chunk { color: #7cf0ff; }
    .done { color: #4ade80; }
    .tool { color: #fbbf24; }
    .error { color: #f87171; }
  </style>
</head>
<body>
<div id="terminal"></div>
<div class="input-line">
  <input id="input" placeholder="输入你的代码需求，回车发送..." autocomplete="off">
  <button id="send">发送</button>
</div>

<script>
const socket = io();

const terminal = document.getElementById('terminal');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let currentOutput = null;
let currentOutputType = '';

function print(text, cls = '') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
  return div;
}

function appendToOutput(text, cls) {
  if (!currentOutput || currentOutputType !== cls) {
    currentOutput = print(text, cls);
    currentOutputType = cls;
  } else {
    currentOutput.textContent += text;
    terminal.scrollTop = terminal.scrollHeight;
  }
}

function endOutput() {
  currentOutput = null;
  currentOutputType = '';
}

function sendQuery() {
  const val = input.value.trim();
  if (!val) return;
  print(`> ${val}`);
  endOutput();
  socket.emit('user_input', val);
  input.value = '';
}
sendBtn.onclick = sendQuery;
input.onkeydown = e => {
  if (e.key === 'Enter') {
    sendQuery();
  }
};

socket.on('acp_output', (msg) => {
  if (!msg || typeof msg !== 'object') {
    print(`格式异常: ${JSON.stringify(msg)}`, 'error');
    return;
  }
  const t = msg.type;
  const p = msg.payload;
  switch (t) {
    case 'chat_chunk':
      appendToOutput(p && p.content || '', 'chunk');
      break;
    case 'chat_done':
      endOutput();
      print('=== 回答完成 ===', 'done');
      break;
    case 'tool_call':
      endOutput();
      print(`⚠️ 请求工具操作: ${JSON.stringify(p && p.tool, null, 2)}`, 'tool');
      const allow = confirm(`是否允许执行工具：${p && p.tool && p.tool.name || '未知'}`);
      socket.emit('tool_confirm', { allow, toolId: p && p.toolId });
      break;
    case 'error':
      endOutput();
      print(`❌ ${p && p.message || '未知错误'}`, 'error');
      break;
    case 'permission_request':
      endOutput();
      const toolCall = p.toolCall;
      const options = p.options || [];
      const title = toolCall && toolCall.title || '未知工具请求';
      const reqId = p.requestId;
      print(`🔐 权限请求: ${title}`, 'tool');
      
      // 处理 think 类型的问题
      if (toolCall && toolCall.kind === 'think' && toolCall.rawInput && toolCall.rawInput.questions) {
        const questions = toolCall.rawInput.questions;
        const answers = [];
        for (const q of questions) {
          print(`\n📌 ${q.header || '问题'}: ${q.question}`, 'tool');
          if (q.options && q.options.length > 0) {
            const qChoiceStr = prompt(`${q.question}\n${q.options.map((o, i) => `${i+1}. ${o.label} - ${o.description || ''}`).join('\n')}\n输入数字(1-${q.options.length})`);
            const qChoice = parseInt(qChoiceStr) - 1;
            if (qChoice >= 0 && qChoice < q.options.length) {
              answers.push(q.options[qChoice].label);
              print(`✅ 选择: ${q.options[qChoice].label}`, 'done');
            } else {
              answers.push('');
              print('❌ 跳过', 'error');
            }
          } else if (!q.multiSelect) {
            const answer = prompt(q.question);
            answers.push(answer || '');
            print(`✅ 回答: ${answer || '(空)'}`, 'done');
          }
        }
        // 发送答案和确认
        socket.emit('permission_response', { requestId: reqId, optionId: 'proceed_once', answers: answers });
        print('✅ 已提交答案', 'done');
      } else {
        // 普通权限请求
        if (options.length > 0) {
          const choiceStr = prompt(`请选择:\n${options.map((o, i) => `${i+1}. ${o.name}`).join('\n')}\n输入数字(1-${options.length})`);
          const choice = parseInt(choiceStr) - 1;
          if (choice >= 0 && choice < options.length) {
            socket.emit('permission_response', { requestId: reqId, optionId: options[choice].optionId });
            print(`✅ 已选择: ${options[choice].name}`, 'done');
          } else {
            socket.emit('permission_response', { requestId: reqId, optionId: 'cancel' });
            print('❌ 已拒绝', 'error');
          }
        }
      }
      break;
    case 'result':
      endOutput();
      break;
    case 'session_update':
      if (p.sessionUpdate === 'agent_message_chunk') {
        appendToOutput(p.content && p.content.text || '', 'chunk');
      } else if (p.sessionUpdate === 'agent_thought_chunk') {
        appendToOutput(p.content && p.content.text || '', 'tool');
      } else if (p._meta && p._meta.usage) {
        endOutput();
      }
      break;
    case '_qwen/notify':
      if (p.kind === 'turn_complete') {
        endOutput();
        print('=== 回答完成 ===', 'done');
      }
      break;
    default:
      break;
  }
});

socket.on('acp_output_raw', txt => print(txt, 'error'));
socket.on('print', txt => print(txt, 'error'));
</script>
</body>
</html>
